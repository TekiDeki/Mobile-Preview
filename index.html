<!-- Applied before the first paint: theme from ?theme=, saved choice or system. -->
<script>
(function () {
  try {
    var root = document.documentElement;
    function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    var params = new URLSearchParams(location.search);
    var urlTheme = params.get('theme');
    var theme = (urlTheme === 'light' || urlTheme === 'dark') ? urlTheme : read('mp-theme');
    if (theme !== 'light' && theme !== 'dark') {
      theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    root.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e1526' : '#f4f6fb');
  } catch (e) {}
})();
</script>

<style>

    justify-content: center;
    align-items: center;
    margin: auto;

    position: relative;

    border-radius: 40px;
    padding: 12px;

  .device-frame.tablet { border-radius: 24px; padding: 16px; }

  .device-frame .notch {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 24px;
    background: #000;
    border-radius: 0 0 16px 16px;
    z-index: 10;
    display: none;

    top: 18px; left: 50%;
    transform: translateX(-50%);
    width: 8px; height: 8px;

    z-index: 11;
    display: none;
    box-shadow: inset 0 0 2px #444;

  .screen {
    width: 100%; height: 100%;

    border-radius: 28px;
    overflow: hidden;
    position: relative;
    transition: all 0.3s ease;

  .device-frame.tablet .screen { border-radius: 12px; }

  .screen iframe {
    width: 100%; height: 100%;
    border: none;
    display: block;
    background: #fff;
  }

  .empty-state {
    width: 100%; height: 100%;

    flex-direction: column;

    color: var(--text-2);

    align-items: center;

    color: var(--text-2);
    min-width: 40px;
    text-align: center;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--scroll-track); }
  ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

  .loading-overlay {
    position: absolute;
    inset: 0;
    background: var(--overlay);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    z-index: 50;
    border-radius: 28px;

  .loading-overlay.active { display: flex; }

  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-overlay p { color: var(--overlay-text); font-size: 13px; }

    background: var(--bg-2);
    color: var(--text);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    text-align: center;
  }

  /* ===== DONATION FOOTER ===== */
  .footer-donation {
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: var(--shadow-footer);
    gap: 14px;
    flex-wrap: wrap;
  }

  .donation-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 26px 14px 20px;
    background: linear-gradient(135deg, #ffdd57 0%, #ffb347 50%, #ff8c42 100%);
    color: #3a2a00;
    text-decoration: none;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
    box-shadow:
      0 6px 20px rgba(255, 140, 66, 0.45),
      0 0 0 1px rgba(255, 255, 255, 0.2) inset,
      0 2px 0 rgba(255, 255, 255, 0.4) inset;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
  }

  .donation-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
    transition: left 0.6s;
  }

  .donation-btn:hover::before { left: 100%; }

  .donation-btn:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow:
      0 12px 30px rgba(255, 140, 66, 0.6),
      0 0 0 1px rgba(255, 255, 255, 0.3) inset,
      0 2px 0 rgba(255, 255, 255, 0.5) inset;
  }

  .donation-btn:active { transform: translateY(-1px) scale(1.01); }

  .donation-btn .coffee-icon {
    font-size: 26px;
    display: inline-block;
    transition: transform 0.3s;
  }

  .donation-btn:hover .coffee-icon { transform: rotate(-10deg) scale(1.15); }

  .donation-btn .coffee-text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
    text-align: left;
  }

  .donation-btn .coffee-text .main { font-size: 15px; font-weight: 800; }
  .donation-btn .coffee-text .sub {
    font-size: 10px;
    font-weight: 600;
    opacity: 0.75;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .donation-btn .paypal-icon { font-size: 18px; opacity: 0.85; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--bg-3);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 200;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .toolbar { padding: 10px; gap: 8px; }
    .input-text { width: 180px; }
    .device-btn { min-width: 60px; padding: 5px 8px; }
    .device-btn .name { font-size: 9px; }
    .ratio-btn { min-width: 50px; padding: 4px 6px; }
    .topbar { padding: 6px 10px; }
    .topbar-brand { font-size: 15px; }
    .topbar-brand .dot { width: 8px; height: 8px; }
  }

  /* Phones and other narrow screens: the tools start collapsed so the frame
     gets the room; one tap on Tools brings them back. */
  @media (max-width: 720px) {
    .topbar { flex-wrap: wrap; justify-content: space-between; row-gap: 6px; }
    .select-lang { order: 3; }
    .tools-toggle { order: 2; }
    .preview-area { padding: 16px 8px; }
    .empty-state { padding: 24px 12px; gap: 10px; }
    .empty-state .es-title { font-size: 17px; }
    .empty-state .es-text, .empty-state .es-note { font-size: 12.5px; }
    .device-frame { max-width: calc(100vw - 16px); }
    .mode-tab { padding: 6px 10px; font-size: 11.5px; }
    .device-btn .size { font-size: 9px; }
    /* the tools button only exists on narrow screens */
    .tools-toggle { display: inline-flex; }
    /* long empty-state copy must wrap inside the viewport instead of being
       clipped by the centred flex wrapper */
    .preview-inner { width: 100%; }
    .empty-state { width: 100%; padding: 20px 4px; }
    .empty-state .es-text,
    .empty-state .es-note { max-width: 100%; }
  }

  #toolsPanel[hidden] { display: none; }

  @media (max-width: 600px) {
    .donation-btn { padding: 12px 18px; }
    .donation-btn .coffee-text .sub { display: none; }
    .donation-btn .coffee-icon { font-size: 22px; }
    .donation-btn .coffee-text .main { font-size: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

let currentLang = 'ro';
let currentTheme = 'dark';
let currentDevice = devices[1];
let currentRatio = null;
let mode = 'device';

let zoom = 100;

let isLocalFile = false;

const LS_LANG = 'mp-lang';
const LS_THEME = 'mp-theme';

/* Storage that keeps working when localStorage is blocked (private mode,
   strict cookie settings): values fall back to an in-memory map. */
const memoryStore = new Map();
function storeGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return memoryStore.has(key) ? memoryStore.get(key) : null; }
}
function storeSet(key, value) {
  memoryStore.set(key, value);
  try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
}

// ===== UTIL =====
function t(key) {
  const dict = translations[currentLang] || translations.en;
  return dict[key] !== undefined ? dict[key] : (translations.en[key] || key);
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ===== I18N APPLY =====
function applyLanguage(lang) {
  if (!translations[lang]) lang = 'en';
  currentLang = lang;
  storeSet(LS_LANG, lang);

  document.documentElement.lang = lang === 'sr-Cyrl' ? 'sr-Cyrl' : (lang === 'sr-Latn' ? 'sr-Latn' : lang);
  document.title = t('title');

  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', t('description'));

  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (val) el.textContent = val;
  });

  // accessible names and tooltips: [data-i18n-aria] -> aria-label, [data-i18n-title] -> title
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => {
    const val = t(el.getAttribute('data-i18n-aria'));
    if (val) el.setAttribute('aria-label', val);
  });
  document.querySelectorAll('[data-i18n-title]').forEach((el) => {
    const val = t(el.getAttribute('data-i18n-title'));
    if (val) el.setAttribute('title', val);
  });

  // theme button label + its accessible name
  updateThemeLabel();
}

function updateThemeLabel() {
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  const toLight = currentTheme === 'dark';
  icon.textContent = toLight ? '☀️' : '🌙';
  label.textContent = toLight ? t('themeLight') : t('themeDark');
  const button = document.getElementById('themeToggle');
  if (button) button.setAttribute('aria-label', t('themeToggleLabel') + ': ' + label.textContent);
}

// ===== THEME =====
function applyTheme(theme, silent) {
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  storeSet(LS_THEME, theme);
  const mt = document.querySelector('meta[name="theme-color"]');
  if (mt) mt.setAttribute('content', theme === 'dark' ? '#0e1526' : '#f4f6fb');
  updateThemeLabel();
  if (!silent) toast(t('toastTheme'));
}

function initTheme() {
  const urlParams = new URLSearchParams(window.location.search);
  const urlTheme = urlParams.get('theme');
  if (urlTheme === 'light' || urlTheme === 'dark') { applyTheme(urlTheme, true); return; }
  const saved = storeGet(LS_THEME);
  if (saved === 'light' || saved === 'dark') { applyTheme(saved, true); return; }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light', true);
}

// ===== URL PARAMS (language) =====
function initLanguage() {
  const urlParams = new URLSearchParams(window.location.search);
  const urlLang = urlParams.get('lang');
  const lang = (urlLang && translations[urlLang])
    ? urlLang
    : (storeGet(LS_LANG) || (navigator.language && navigator.language.startsWith('en') ? 'en' : 'ro'));
  applyLanguage(lang);
  document.getElementById('langSelect').value = lang;
}

// ===== DRAG AND DROP =====
/* Dropping an .html file anywhere on the preview area loads it, the same way
   the file picker does. */
function setupDropZone() {
  const zone = document.getElementById('previewArea');
  const hint = document.getElementById('dropHint');
  let depth = 0;

  const showHint = () => { hint.hidden = false; };
  const hideHint = () => { hint.hidden = true; depth = 0; };

  ['dragenter', 'dragover'].forEach((type) => {
    zone.addEventListener(type, (event) => {
      event.preventDefault();
      if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
      if (type === 'dragenter') depth += 1;
      showHint();
    });
  });
  zone.addEventListener('dragleave', () => {
    depth -= 1;
    if (depth <= 0) hideHint();
  });
  zone.addEventListener('drop', (event) => {
    event.preventDefault();
    hideHint();
    const files = event.dataTransfer && event.dataTransfer.files;
    if (!files || !files.length) return;
    const file = files[0];
    if (!/\.html?$/i.test(file.name) && file.type !== 'text/html') {
      toast(t('toastWrongFile'));
      return;
    }
    loadLocalFile(file);
  });

  // a file dropped outside the zone must not navigate the page away
  window.addEventListener('dragover', (event) => event.preventDefault());
  window.addEventListener('drop', (event) => event.preventDefault());
}

// ===== INIT =====
function init() {
  initTheme();
  initLanguage();
  renderDeviceButtons();
  renderRatioButtons();

  // tools panel: collapsed by default on phones, remembers the user's choice
  const toolsPanel = document.getElementById('toolsPanel');
  const toolsToggle = document.getElementById('toolsToggle');
  const smallScreen = window.matchMedia ? window.matchMedia('(max-width: 720px)') : null;
  const savedTools = storeGet('mp-tools');
  const toolsOpen = savedTools === 'open' || (savedTools !== 'closed' && !(smallScreen && smallScreen.matches));
  const setTools = (open, remember) => {
    toolsPanel.hidden = !open;
    toolsToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (remember) storeSet('mp-tools', open ? 'open' : 'closed');
  };
  setTools(toolsOpen, false);
  toolsToggle.addEventListener('click', () => {
    setTools(toolsPanel.hidden, true);
  });

  // mode tabs
  document.querySelectorAll('.mode-tab').forEach((tab) => {
    tab.addEventListener('click', () => switchMode(tab.dataset.mode));
  });
  document.querySelector('.mode-tabs').addEventListener('keydown', onTabKeydown);

  // generated selectors (event delegation, no inline handlers)
  document.getElementById('deviceSelector').addEventListener('click', (event) => {
    const button = event.target.closest('.device-btn');
    if (button) selectDevice(button.dataset.id);
  });
  document.getElementById('ratioSelector').addEventListener('click', (event) => {
    const button = event.target.closest('.ratio-btn');
    if (button) selectRatio(button.dataset.id);
  });

  // loading content
  const fileInput = document.getElementById('fileInput');
  document.getElementById('btnLoadFile').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (event) => {
    const file = event.target.files && event.target.files[0];
    loadLocalFile(file);
    fileInput.value = '';
  });
  document.getElementById('btnLoadUrl').addEventListener('click', loadFromUrl);
  document.getElementById('urlInput').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') { event.preventDefault(); loadFromUrl(); }
  });
  setupDropZone();

  // frame controls
  document.getElementById('btnPortrait').addEventListener('click', () => setOrientation('portrait'));
  document.getElementById('btnLandscape').addEventListener('click', () => setOrientation('landscape'));
  document.getElementById('btnZoomOut').addEventListener('click', () => changeZoom(-10));
  document.getElementById('btnZoomIn').addEventListener('click', () => changeZoom(10));
  document.getElementById('btnReload').addEventListener('click', reloadPreview);
  document.getElementById('btnOpenTab').addEventListener('click', openInNewTab);
  document.getElementById('btnReset').addEventListener('click', resetAll);

  // panel inputs
  document.getElementById('ratioBaseWidth').addEventListener('change', applyRatio);
  document.getElementById('ratioDisplayScale').addEventListener('input', () => {
    syncScaleLabel('ratioDisplayScale', 'ratioScaleLabel');
    applyRatio();
  });
  ['customW', 'customH', 'customFrameType'].forEach((id) => {
    document.getElementById(id).addEventListener('change', applyCustom);
  });
  document.getElementById('customScale').addEventListener('input', () => {
    syncScaleLabel('customScale', 'customScaleLabel');
    applyCustom();
  });

  // interface
  document.getElementById('langSelect').addEventListener('change', (e) => {
    applyLanguage(e.target.value);
    toast(t('toastLang'));
  });
  document.getElementById('themeToggle').addEventListener('click', () => {
    applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
  });

  // follow the system theme until the user picks one explicitly
  const scheme = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  if (scheme) {
    const onSchemeChange = (event) => {
      if (!storeGet(LS_THEME)) applyTheme(event.matches ? 'dark' : 'light', true);
    };
    if (scheme.addEventListener) scheme.addEventListener('change', onSchemeChange);
    else if (scheme.addListener) scheme.addListener(onSchemeChange);
  }

  // ?mode=device|ratio|custom opens a panel directly (also used by shortcuts)
  const params = new URLSearchParams(location.search);
  const urlMode = params.get('mode');
  switchMode(MODES.indexOf(urlMode) === -1 ? 'device' : urlMode);
  selectDevice(currentDevice.id);

  // ?focus=url|file lands on the matching control, for the PWA shortcuts
  const focusTarget = params.get('focus');
  if (focusTarget === 'url') document.getElementById('urlInput').focus();
  else if (focusTarget === 'file') document.getElementById('btnLoadFile').focus();
}

function renderDeviceButtons() {
  const container = document.getElementById('deviceSelector');
  container.innerHTML = devices.map(d => `
    <button class="device-btn" type="button" data-id="${d.id}" aria-pressed="false">
      <span class="icon" aria-hidden="true">${d.icon}</span>
      <span class="name">${d.name}</span>
      <span class="size">${d.width}×${d.height} px</span>
    </button>
  `).join('');
}

function renderRatioButtons() {
  const container = document.getElementById('ratioSelector');
  container.innerHTML = aspectRatios.map(r => {
    const maxDim = 24;
    let boxW, boxH;
    if (r.w >= r.h) { boxW = maxDim; boxH = Math.round(maxDim * (r.h / r.w)); }
    else { boxH = maxDim; boxW = Math.round(maxDim * (r.w / r.h)); }
    return `
      <button class="ratio-btn" type="button" data-id="${r.id}" aria-pressed="false" aria-label="${r.label}">
        <div class="ratio-preview">
          <div class="ratio-box" style="width:${boxW}px;height:${boxH}px;"></div>
        </div>
        <span class="ratio-label" aria-hidden="true">${r.label}</span>
      </button>
    `;
  }).join('');
}

function syncScaleLabel(inputId, labelId) {
  const input = document.getElementById(inputId);
  const label = document.getElementById(labelId);
  if (input && label) label.textContent = input.value + '%';
}

// ===== MODE SWITCH =====
const MODES = ['device', 'ratio', 'custom'];

function switchMode(newMode, options) {
  if (MODES.indexOf(newMode) === -1) newMode = 'device';
  const opts = options || {};
  mode = newMode;
  document.querySelectorAll('.mode-tab').forEach((tb, i) => {
    const active = MODES[i] === newMode;
    tb.classList.toggle('active', active);
    tb.setAttribute('aria-selected', active ? 'true' : 'false');
    tb.setAttribute('tabindex', active ? '0' : '-1');
    if (active && opts.focus) tb.focus();
  });
  MODES.forEach((name) => {
    const panel = document.getElementById('panel' + name.charAt(0).toUpperCase() + name.slice(1));
    const active = name === newMode;
    panel.classList.toggle('active', active);
    panel.hidden = !active;
  });

  if (newMode === 'device') applyDevice();
  else if (newMode === 'ratio') applyRatio();
  else applyCustom();
}

/* Arrow keys, Home and End move between the mode tabs. */
function onTabKeydown(event) {
  const tabs = [...document.querySelectorAll('.mode-tab')];
  const currentIndex = tabs.indexOf(event.target.closest('.mode-tab'));
  if (currentIndex === -1) return;
  let next = null;
  if (event.key === 'ArrowRight') next = (currentIndex + 1) % tabs.length;
  else if (event.key === 'ArrowLeft') next = (currentIndex - 1 + tabs.length) % tabs.length;
  else if (event.key === 'Home') next = 0;
  else if (event.key === 'End') next = tabs.length - 1;
  if (next === null) return;
  event.preventDefault();
  switchMode(MODES[next], { focus: true });
}

// ===== DEVICE SELECT =====
function selectDevice(id) {
  currentDevice = devices.find(d => d.id === id) || devices[0];
  currentRatio = null;
  document.querySelectorAll('.device-btn').forEach(b => {
    const active = b.dataset.id === id;
    b.classList.toggle('active', active);
    b.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
  document.querySelectorAll('.ratio-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
  applyDevice();
}

// ===== RATIO SELECT =====
function selectRatio(id) {
  currentRatio = aspectRatios.find(r => r.id === id);
  document.querySelectorAll('.ratio-btn').forEach(b => {
    const active = b.dataset.id === id;
    b.classList.toggle('active', active);
    b.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
  document.querySelectorAll('.device-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
  applyRatio();
}

// ===== ORIENTATION =====
function setOrientation(o) {
  orientation = o === 'landscape' ? 'landscape' : 'portrait';
  const portrait = document.getElementById('btnPortrait');
  const landscape = document.getElementById('btnLandscape');
  portrait.classList.toggle('active', orientation === 'portrait');
  landscape.classList.toggle('active', orientation === 'landscape');
  portrait.setAttribute('aria-pressed', orientation === 'portrait' ? 'true' : 'false');
  landscape.setAttribute('aria-pressed', orientation === 'landscape' ? 'true' : 'false');
  reapply();
}

// ===== ZOOM =====
function changeZoom(delta) {
  zoom = Math.max(25, Math.min(200, zoom + delta));
  document.getElementById('zoomLabel').textContent = zoom + '%';
  reapply();
}

function reapply() {
  if (mode === 'device') applyDevice();
  else if (mode === 'ratio') applyRatio();
  else applyCustom();
}

// ===== APPLY DEVICE =====
function applyDevice() {
  let w = currentDevice.width;
  let h = currentDevice.height;
  if (orientation === 'landscape') [w, h] = [h, w];
  renderFrame(w, h, currentDevice.type, zoom / 100);
}

/* Keeps a numeric input inside its declared range and says so when it clamps. */
function clampNumberInput(input, min, max, fallback) {
  if (!input) return fallback;
  const raw = input.value.trim();
  const parsed = Number.parseInt(raw, 10);
  let value = Number.isFinite(parsed) ? parsed : fallback;
  const outside = raw !== '' && (value < min || value > max);
  if (value < min) value = min;
  if (value > max) value = max;
  if (String(value) !== raw) input.value = String(value);
  if (outside) {
    toast(t('toastClamped').replace('{min}', String(min)).replace('{max}', String(max)));
  }
  return value;
}

// ===== APPLY RATIO =====
function applyRatio() {
  if (!currentRatio) currentRatio = aspectRatios[5];
  const baseSize = clampNumberInput(document.getElementById('ratioBaseWidth'), 200, 2000, 390);
  const scaleValue = clampNumberInput(document.getElementById('ratioDisplayScale'), 20, 150, 100);
  const displayScale = scaleValue / 100;

  /* Portrait always renders a frame taller than wide and landscape always
     renders one wider than tall, whichever ratio is picked (16:9 and 9:16
     both behave as expected instead of swapping the frame). */
  const ratioVal = currentRatio.w / currentRatio.h;
  const longSide = Math.round(baseSize * Math.max(ratioVal, 1 / ratioVal));

  let w, h;
  if (orientation === 'landscape') { h = baseSize; w = longSide; }
  else { w = baseSize; h = longSide; }

  renderFrame(w, h, 'phone', displayScale);
}

// ===== APPLY CUSTOM =====
function applyCustom() {
  const w = clampNumberInput(document.getElementById('customW'), 100, 4000, 390);
  const h = clampNumberInput(document.getElementById('customH'), 100, 4000, 844);
  const scale = clampNumberInput(document.getElementById('customScale'), 20, 150, 100) / 100;
  const frameType = document.getElementById('customFrameType').value;

  let ww = w, hh = h;
  if (orientation === 'landscape') [ww, hh] = [h, w];

  renderFrame(ww, hh, frameType, scale);
}

// ===== RENDER FRAME =====
function renderFrame(w, h, frameType, scale) {
  const frame = document.getElementById('deviceFrame');
  const screen = document.getElementById('screen');

  const previewArea = document.getElementById('previewArea');
  const availW = previewArea.clientWidth - 80;
  const availH = previewArea.clientHeight - 80;

  const framePadding = frameType === 'none' ? 0 : (frameType === 'tablet' ? 32 : 24);
  const totalW = (w + framePadding) * scale;
  const totalH = (h + framePadding) * scale;

  if (totalW > availW || totalH > availH) {
    const fitScale = Math.min(availW / (w + framePadding), availH / (h + framePadding));
    scale = Math.min(scale, fitScale);
  }

  if (frameType === 'none') {
    frame.className = 'device-frame none';
    frame.style.background = 'transparent';
    frame.style.borderRadius = '0';
    frame.style.padding = '0';
    frame.style.boxShadow = 'none';
  } else {
    frame.className = 'device-frame ' + frameType;
    frame.style.background = 'var(--frame-bg)';
    frame.style.borderRadius = frameType === 'phone' ? '40px' : '24px';
    frame.style.padding = frameType === 'phone' ? '12px' : '16px';
    frame.style.boxShadow = '0 0 0 2px var(--frame-ring-1), 0 0 0 4px var(--frame-ring-2), 0 20px 60px var(--frame-shadow), 0 0 80px var(--accent-glow)';
  }

  frame.style.transform = `scale(${scale})`;
  frame.style.transformOrigin = 'center center';
  /* Nothing is loaded yet -> keep the empty state alone on screen. */
  frame.style.display = hasContent() ? 'block' : 'none';

  screen.style.width = w + 'px';
  screen.style.height = h + 'px';
  screen.style.borderRadius = frameType === 'phone' ? '28px' : (frameType === 'tablet' ? '12px' : '0');
}

// ===== CONTENT STATE =====
const MAX_FILE_MB = 8;
const MAX_FILE_BYTES = MAX_FILE_MB * 1024 * 1024;
let loadingTimer = null;

function hasContent() {
  return isLocalFile ? !!currentHtmlContent : !!currentUrl;
}

/* The app never stores the previewed page; say so once something is loaded. */
function updateUnsavedNote() {
  const note = document.getElementById('unsavedNote');
  if (note) note.hidden = !isLocalFile;
}

// ===== LOAD LOCAL FILE =====
function loadLocalFile(file) {
  if (!file) return;
  if (file.size > MAX_FILE_BYTES) {
    toast(t('toastFileTooBig').replace('{max}', String(MAX_FILE_MB)));
    return;
  }
  const reader = new FileReader();
  reader.onload = function (e) {
    currentHtmlContent = String(e.target.result);
    currentUrl = '';
    isLocalFile = true;
    showPreview();
    toast(t('toastFileLoaded'));
  };
  reader.onerror = function () { toast(t('toastNoContent')); };
  reader.readAsText(file);
}

// ===== LOAD FROM URL =====
/* Only real web addresses are accepted: javascript:, data:, file: and other
   schemes are rejected instead of being handed to the frame. */
function loadFromUrl() {
  const raw = document.getElementById('urlInput').value.trim();
  if (!raw) { toast(t('toastInvalidUrl')); return; }
  const candidate = /^[a-z][a-z0-9+.-]*:/i.test(raw) ? raw : 'https://' + raw;
  let parsed = null;
  try { parsed = new URL(candidate); } catch (e) { parsed = null; }
  if (!parsed || !parsed.hostname || (parsed.protocol !== 'http:' && parsed.protocol !== 'https:')) {
    toast(t('toastInvalidUrl'));
    return;
  }
  currentUrl = parsed.href;
  currentHtmlContent = null;
  isLocalFile = false;
  document.getElementById('urlInput').value = currentUrl;
  showPreview();
}

// ===== SANDBOX =====
/* Content that would otherwise run on this origin is never given
   allow-same-origin, so a previewed file cannot reach this app, its storage or
   its other tabs. Remote pages keep their own origin (realistic cookies and
   storage) but stay equally isolated from the app. */
const SANDBOX_STRICT = 'allow-scripts allow-forms allow-popups allow-modals';
const SANDBOX_REMOTE = 'allow-same-origin ' + SANDBOX_STRICT;

function setFrameSandbox(allowSameOrigin) {
  const iframe = document.getElementById('previewFrame');
  iframe.setAttribute('sandbox', allowSameOrigin ? SANDBOX_REMOTE : SANDBOX_STRICT);
}

function isSameOrigin(url) {
  try { return new URL(url, location.href).origin === location.origin; } catch (e) { return true; }
}

// ===== SHOW PREVIEW =====
function showPreview() {
  const emptyState = document.getElementById('emptyState');
  const frame = document.getElementById('deviceFrame');
  const iframe = document.getElementById('previewFrame');
  const loading = document.getElementById('loadingOverlay');

  if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }

  emptyState.style.display = 'none';
  frame.style.display = 'block';
  loading.classList.add('active');

  if (isLocalFile) {
    setFrameSandbox(false);
    iframe.removeAttribute('src');
    iframe.srcdoc = currentHtmlContent;
  } else {
    setFrameSandbox(!isSameOrigin(currentUrl));
    iframe.removeAttribute('srcdoc');
    iframe.src = currentUrl;
  }

  updateUnsavedNote();
  reapply();
  iframe.onload = function () { loading.classList.remove('active'); };
  clearTimeout(loadingTimer);
  loadingTimer = setTimeout(() => loading.classList.remove('active'), 5000);
}

function reloadPreview() {
  if (!hasContent()) { toast(t('toastNoContent')); return; }
  const iframe = document.getElementById('previewFrame');
  const loading = document.getElementById('loadingOverlay');
  loading.classList.add('active');
  if (isLocalFile) iframe.srcdoc = currentHtmlContent;
  else iframe.src = currentUrl;
  updateUnsavedNote();
  clearTimeout(loadingTimer);
  loadingTimer = setTimeout(() => loading.classList.remove('active'), 3000);
}

/* Opens the current preview as a normal browser tab. The new tab never gets a
   handle on this window (noopener). */
function openInNewTab() {
  if (!hasContent()) { toast(t('toastNoContent')); return; }
  let url = currentUrl;
  if (isLocalFile) {
    const blob = new Blob([currentHtmlContent], { type: 'text/html' });
    url = URL.createObjectURL(blob);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }
  const tab = window.open(url, '_blank', 'noopener,noreferrer');
  if (!tab) toast(t('toastNoContent'));
}

function resetAll() {
  currentRatio = null;
  zoom = 100;
  document.getElementById('zoomLabel').textContent = '100%';
  document.getElementById('ratioBaseWidth').value = '390';
  document.getElementById('ratioDisplayScale').value = '100';
  syncScaleLabel('ratioDisplayScale', 'ratioScaleLabel');
  document.getElementById('customW').value = '390';
  document.getElementById('customH').value = '844';
  document.getElementById('customScale').value = '100';
  syncScaleLabel('customScale', 'customScaleLabel');
  document.getElementById('customFrameType').value = 'phone';
  document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
  setOrientation('portrait');
  switchMode('device');
  selectDevice('iphone-12');
  toast(t('toastReset'));
  document.getElementById('btnLoadFile').focus();
}

window.addEventListener('resize', () => {
  if (document.getElementById('deviceFrame').style.display !== 'none') reapply();
});

// ===== PWA: service worker =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
  /* sw.js only posts this after it replaced an older cache, so the bar never
     shows up on a first visit. Reloading stays the user's choice. */
  navigator.serviceWorker.addEventListener('message', (event) => {
    if (event.data && event.data.type === 'SW_UPDATED') {
      const bar = document.getElementById('updateBar');
      if (bar) bar.hidden = false;
    }
  });
  document.getElementById('btnUpdateReload').addEventListener('click', () => window.location.reload());
}

init();
</script>

  }
  window.addEventListener('beforeinstallprompt',event=>{
    if(isInstalled())return;event.preventDefault();pending=event;refresh();
  });
  button.addEventListener('click',async()=>{
    if(busy||isInstalled())return;
    if(!pending||!isSecureContext||location.protocol==='file:'){help();return;}
    const prompt=pending;pending=null;busy=true;button.disabled=true;statusKey=null;refresh();
    try{
      await prompt.prompt();
      const choice=await prompt.userChoice;
      if(!isInstalled())statusKey=choice?.outcome==='accepted'?'accepted':'dismissed';
    }catch(_){help(true);}
    finally{busy=false;button.disabled=false;refresh();}
  });
  close.addEventListener('click',()=>dialog.close());
  window.addEventListener('appinstalled',()=>{installed=true;pending=null;statusKey=null;refresh();});
  for(const query of [standalone,minimal,overlay]){
    if(query.addEventListener)query.addEventListener('change',refresh);
    else if(query.addListener)query.addListener(refresh);
  }
  refresh();
  new MutationObserver(refresh).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
})();

</script>
</body>
</html>
